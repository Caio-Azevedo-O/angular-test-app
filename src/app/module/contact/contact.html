<div>
    <form action="" class="rounded bg-dark p-5 w-50 justify-content-center d-flex flex-column mx-auto mt-5" (submit)="false">
        <h2 class="text-light">Contact Us</h2>
        <div>
            <label for="Name" class="text-light form-text">Nome</label>
            <input type="text" class="form-control" placeholder="" id="Name" [(ngModel)]="name" [ngModelOptions]="{standalone: true}" #nameInput (keydown.enter)="focusNext(emailInput)">
        </div>
        <div>

        </div>
        <div>
            <label for="Email" class="text-light form-text">Email</label>
            <input type="email" id="Email" class="form-control" [(ngModel)]="email" [ngModelOptions]="{standalone: true}" #emailInput (keydown.enter)="focusNext(messageInput)">
        </div>
        <div>
            <label for="Message" class="text-light form-text">Mensagem</label>
            <textarea id="Message" style="resize: none;" class="form-control" [(ngModel)]="message" [ngModelOptions]="{standalone: true}" #messageInput></textarea>
        </div>
        <button type="button" class="btn btn-success mt-2 w-25" (click)="submit()">Enviar</button>
    </form>
</div>
