<div class="overlay">
    <div class="rounded bg-dark p-3 w-50 login-form">
        <div class="d-flex">
            <h2 class="text-light">Faça seu login!</h2>
            <button type="button" (click)="close.emit()" class="ms-auto btn btn-danger close-form"><i class="bi bi-x"></i></button>
        </div>
        @if(failedToLogin){
            <p class="alert alert-danger">Senha e/ou usuário errados</p>
        }
        <form action="" class="p-3" (ngSubmit)="false">
            <div class="my-2">
                <label for="User" class="form-text text-light">User</label>
                <input [(ngModel)]="user" [ngModelOptions]="{standalone: true}" type="text" id="User" class="form-control" placeholder="User" (keydown.enter)="focusNext(passwordInput)" #userInput>
            </div>
            <div class="my-2">
                <label for="Password" class="form-text text-light">Password</label>
                <input [(ngModel)]="password" [ngModelOptions]="{standalone: true}" type="password" id="Password" class="form-control" placeholder="Password" #passwordInput>
            </div>
            <button type="button" (click)="login()" class="btn btn-success" id="message">Login</button>
        </form>
    </div>
</div>
